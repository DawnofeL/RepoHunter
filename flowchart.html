<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepoHunter · 全景架构流程图</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg:      #ECE8DF;
  --dark:    #1C1A12;
  --dark2:   #262318;

  --t1: #1C1A12;
  --t2: rgba(28,26,18,0.60);
  --t3: rgba(28,26,18,0.38);
  --tw:  #F4F1E8;
  --tw2: rgba(244,241,232,0.72);
  --tw3: rgba(244,241,232,0.42);

  /* 森林色板 · 自然科学与生命 */
  --moss:   #4A6741;
  --kombu:  #2D4E30;
  --lime:   #B6C849;
  --cedar:  #8A5030;
  --amber:  #B8820A;
  --teal:   #3A6A66;
  --rust:   #B06A4A;

  --expo:   cubic-bezier(0.16,1,0.3,1);
  --spring: cubic-bezier(0.34,1.4,0.5,1);
  --smooth: cubic-bezier(0.25,0.46,0.45,0.94);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:var(--bg); overflow:hidden; }
body {
  font-family:'Be Vietnam Pro','Microsoft YaHei',sans-serif;
  color:var(--t1);
  -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none;
}

/* 背景三层 */
.bg-grid {
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(circle, rgba(28,26,18,0.05) 1px, transparent 1px);
  background-size:30px 30px;
}
.bg-glow {
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 18% 22%, rgba(74,103,65,0.07), transparent 70%),
    radial-gradient(ellipse 55% 45% at 82% 80%, rgba(138,80,48,0.06), transparent 70%);
}
.grain {
  position:fixed; inset:0; pointer-events:none; z-index:1; opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:160px 160px;
}

/* HUD */
.hud-divider {
  position:fixed; top:64px; left:30px; width:196px; height:1px; z-index:40; pointer-events:none;
  background:linear-gradient(90deg, rgba(138,80,48,0.40) 0, rgba(138,80,48,0.12) 60%, transparent 100%);
}
.hud-left  { position:fixed; top:22px; left:30px; z-index:50; pointer-events:none; }
.hud-acc   { width:18px; height:2px; background:var(--lime); margin-bottom:8px; }
.hud-title { font-size:14px; font-weight:800; letter-spacing:0.04em; color:var(--t1); }
.hud-sub   { font-family:'JetBrains Mono',monospace; font-size:7.5px; color:var(--t3);
             letter-spacing:0.22em; margin-top:5px; text-transform:uppercase; }
.hud-right { position:fixed; top:22px; right:30px; z-index:50; pointer-events:none; text-align:right; }
.hud-badge { font-family:'JetBrains Mono',monospace; font-size:7px; letter-spacing:0.2em;
             color:var(--t3); text-transform:uppercase; }
.hud-name  { font-size:12px; font-weight:700; letter-spacing:0.06em; color:var(--t1); margin-top:5px; }

/* 画布视口 */
#viewport {
  position:fixed; inset:0; z-index:10; overflow:hidden;
  cursor:grab; touch-action:none;
  user-select:none; -webkit-user-select:none;
}
#viewport.grabbing { cursor:grabbing; }
#canvas {
  position:absolute; top:0; left:0;
  width:2950px; height:2600px;
  transform-origin:0 0;
  will-change:transform;
}

/* 区域水印标签 */
.region {
  position:absolute; transform:translate(-50%,-50%);
  font-family:'JetBrains Mono',monospace; letter-spacing:0.34em;
  text-transform:uppercase; color:rgba(28,26,18,0.11);
  font-size:13px; font-weight:500; pointer-events:none; white-space:nowrap; z-index:1;
}
.region .r-tick { display:inline-block; width:22px; height:1px; background:rgba(28,26,18,0.15);
  vertical-align:middle; margin-right:10px; }

/* 连线层 */
#edges { position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none; overflow:visible; }
.edge-base { fill:none; stroke:rgba(28,26,18,0.24); stroke-width:1.5; transition:opacity 0.4s ease; }
.edge-base.e-dash     { stroke:rgba(184,130,10,0.48); stroke-dasharray:6 5; }
.edge-base.e-feedback { stroke:rgba(58,106,102,0.45); stroke-dasharray:5 6; }
.edge-base.ehidden, .edge-flow.ehidden { opacity:0 !important; }
.edge-flow { fill:none; stroke:rgba(28,26,18,0.15); stroke-width:1.5;
  stroke-dasharray:1.5 13; stroke-linecap:round; animation:dashflow 1.7s linear infinite;
  opacity:0; transition:opacity 0.9s ease; }
.edge-flow.live { opacity:1; }
@keyframes dashflow { to { stroke-dashoffset:-29; } }

/* 边标签 */
#labelLayer { position:absolute; top:0; left:0; width:100%; height:100%; z-index:3; pointer-events:none; }
.elabel {
  position:absolute; transform:translate(-50%,-50%);
  font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.03em;
  color:var(--t2); background:var(--bg); padding:2px 8px; border-radius:5px;
  border:1px solid rgba(28,26,18,0.08); white-space:nowrap;
  opacity:0; transition:opacity 0.5s ease;
}
.elabel.show { opacity:1; }
.elabel.ehidden { opacity:0 !important; }

/* 节点 */
.node { position:absolute; transform:translate(-50%,-50%); z-index:5; transition:opacity 0.42s var(--smooth); }
.node.collapsed-hidden { opacity:0; pointer-events:none; }

/* 折叠角标 +N */
.node-badge {
  position:absolute; right:-9px; bottom:-9px; z-index:8;
  min-width:23px; height:23px; padding:0 7px; border-radius:12px;
  color:#EDE7D7;
  font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500;
  display:flex; align-items:center; justify-content:center;
  border:1px solid transparent;
  opacity:0; transform:scale(0.5); pointer-events:none;
  transition:opacity 0.32s ease, transform 0.32s var(--spring), background 0.32s ease, box-shadow 0.32s ease;
}
.node-badge.on {
  opacity:1; transform:scale(1); pointer-events:auto; cursor:pointer;
  background:#3A3528; box-shadow:0 4px 12px rgba(28,26,18,0.25);
  border-color:rgba(182,200,73,0.35);
}

.card {
  position:relative; border-radius:13px; padding:13px 17px 14px; cursor:pointer;
  opacity:0; transform:translateY(10px) scale(0.965);
  transition: opacity 0.6s var(--smooth),
              transform 0.72s cubic-bezier(0.22,1,0.36,1),
              box-shadow 0.35s var(--smooth), background 0.3s ease;
  overflow:hidden;
}
.card.shown { opacity:1; transform:translateY(0) scale(1); }
.card.shown:hover { transform:translateY(-2px) scale(1.035); z-index:9; }
.card.selected {
  animation:none !important;
  transform:translateY(-3px) scale(1.045) !important;
  outline:2px solid rgba(182,200,73,0.9); outline-offset:3px;
  box-shadow:0 18px 46px rgba(28,26,18,0.26), 0 0 32px rgba(182,200,73,0.30) !important;
  z-index:14 !important;
}

.n-step  { font-family:'JetBrains Mono',monospace; font-size:7.5px; letter-spacing:0.16em;
           text-transform:uppercase; margin-bottom:6px; }
.n-title { font-size:13.5px; font-weight:700; letter-spacing:-0.01em; line-height:1.25; }
.n-sub   { font-size:10px; font-weight:400; line-height:1.4; margin-top:4px; }
.n-pills { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; }
.pill {
  font-family:'JetBrains Mono',monospace; font-size:7px; letter-spacing:0.06em;
  padding:2px 7px; border-radius:4px; white-space:nowrap;
}
.n-accent { position:absolute; left:17px; bottom:9px; width:26px; height:2px; border-radius:2px; }

/* 深卡 · 起点 */
.k-start { background:var(--dark); width:188px; box-shadow:0 5px 22px rgba(28,26,18,0.16); }
.k-start::before { content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(244,241,232,0.06) 0%, transparent 55%); pointer-events:none; }
.k-start .n-step  { color:rgba(182,200,73,0.78); }
.k-start .n-title { color:var(--tw); }
.k-start .n-sub   { color:var(--tw2); }

/* 深卡 · 里程碑 */
.k-core {
  background:var(--dark2); width:236px;
  border:1px solid rgba(182,200,73,0.22);
  box-shadow:0 6px 30px rgba(28,26,18,0.24), 0 0 44px rgba(182,200,73,0.07);
}
.k-core.live { animation:breathe 4.6s ease-in-out infinite; }
.k-core::before { content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(182,200,73,0.08) 0%, transparent 60%); pointer-events:none; }
.k-core:hover { box-shadow:0 16px 46px rgba(28,26,18,0.3), 0 0 52px rgba(182,200,73,0.16); }
.k-core .n-step  { color:rgba(182,200,73,0.8); }
.k-core .n-title { color:var(--tw); font-size:15px; }
.k-core .n-sub   { color:var(--tw2); }
@keyframes breathe {
  0%,100% { box-shadow:0 6px 30px rgba(28,26,18,0.24), 0 0 40px rgba(182,200,73,0.06); }
  50%     { box-shadow:0 6px 32px rgba(28,26,18,0.27), 0 0 60px rgba(182,200,73,0.18); }
}

/* 石白卡 · 普通流程 */
.k-glass {
  background:linear-gradient(158deg, rgba(253,251,246,0.88), rgba(242,238,228,0.8)); width:200px;
  border:1px solid rgba(28,26,18,0.07);
  box-shadow:0 4px 18px rgba(28,26,18,0.05), inset 0 1px 0 rgba(255,255,255,0.75);
  backdrop-filter:blur(7px);
}
.k-glass:hover { background:linear-gradient(158deg, rgba(255,253,249,0.96), rgba(247,243,233,0.9));
  box-shadow:0 12px 30px rgba(28,26,18,0.12); }
.k-glass .n-step  { color:var(--t3); }
.k-glass .n-title { color:var(--t1); }
.k-glass .n-sub   { color:var(--t2); }
.k-glass .pill    { background:rgba(28,26,18,0.06); color:rgba(28,26,18,0.52); }

/* 产出卡 · 绿 */
.k-out {
  background:rgba(45,78,48,0.10); width:198px;
  border:1px solid rgba(45,78,48,0.30);
  box-shadow:0 3px 16px rgba(45,78,48,0.08);
}
.k-out.live { animation:glowpulse 4.4s ease-in-out infinite; }
.k-out:hover { background:rgba(45,78,48,0.16); box-shadow:0 12px 30px rgba(45,78,48,0.18); }
.k-out .n-step  { color:var(--kombu); opacity:0.7; }
.k-out .n-title { color:var(--kombu); }
.k-out .n-sub   { color:var(--moss); }
@keyframes glowpulse {
  0%,100% { box-shadow:0 3px 16px rgba(45,78,48,0.08); }
  50%     { box-shadow:0 3px 20px rgba(45,78,48,0.18), 0 0 26px rgba(45,78,48,0.10); }
}

/* 兜底卡 · 锈红 */
.k-warn {
  background:rgba(176,106,74,0.10); width:198px;
  border:1px solid rgba(176,106,74,0.32);
  box-shadow:0 3px 16px rgba(176,106,74,0.08);
}
.k-warn:hover { background:rgba(176,106,74,0.16); box-shadow:0 12px 30px rgba(176,106,74,0.16); }
.k-warn .n-step  { color:var(--rust); opacity:0.8; }
.k-warn .n-title { color:#8a4226; }
.k-warn .n-sub   { color:var(--rust); }

/* 控件 */
.controls { position:fixed; bottom:28px; right:30px; z-index:50; display:flex; flex-direction:column; gap:6px; }
.ctrl-btn {
  width:34px; height:34px; border-radius:8px; cursor:pointer;
  background:rgba(255,255,255,0.62); border:1px solid rgba(28,26,18,0.12);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--t2); font-family:'JetBrains Mono',monospace;
  box-shadow:0 2px 10px rgba(28,26,18,0.06); transition:all 0.18s; user-select:none;
  backdrop-filter:blur(8px);
}
.ctrl-btn:hover { background:rgba(255,255,255,0.85); color:var(--t1); transform:translateY(-1px); }
.ctrl-btn svg { width:15px; height:15px; }
.ctrl-sep { height:1px; margin:2px 5px; background:rgba(28,26,18,0.12); }

/* 右侧抽屉 · 可拖拽调宽 + 禁选中（禁选中防拖出一片蓝，参考图截图那种） */
#drawer {
  position:fixed; top:0; right:0; bottom:0; z-index:60; width:420px;
  min-width:320px; max-width:760px;
  background:#E2DDD0; border-left:1px solid rgba(28,26,18,0.10);
  padding:26px 30px 0; transform:translateX(100%); visibility:hidden;
  transition:transform 0.52s var(--expo), visibility 0s linear 0.52s;
  box-shadow:-8px 0 44px rgba(28,26,18,0.14);
  overflow:hidden;
  display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none;
}
#drawer.open { transform:translateX(0); visibility:visible;
  transition:transform 0.52s var(--expo), visibility 0s linear 0s; }
#drawer.resizing { transition:none; }
/* 左边缘拖拽把手：鼠标移上去光标变左右双箭头，按住拖动改宽度 */
.drawer-resize {
  position:absolute; top:0; left:-3px; bottom:0; width:7px; z-index:61; cursor:ew-resize;
}
.drawer-resize:hover, .drawer-resize.dragging { background:rgba(74,103,65,0.22); }
.d-head { display:flex; justify-content:space-between; align-items:flex-start; flex-shrink:0; }
.d-badge { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:7px;
  letter-spacing:0.2em; text-transform:uppercase; padding:4px 11px; border-radius:4px; margin-bottom:9px; }
.d-title { font-size:22px; font-weight:800; letter-spacing:-0.02em; color:#1C1610; }
.d-sub   { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--t3); letter-spacing:0.05em; margin-top:7px; }
.d-close { background:none; border:1px solid rgba(28,26,18,0.16); border-radius:6px;
  padding:6px 12px; cursor:pointer; font-size:15px; color:var(--t3); line-height:1; transition:all 0.16s; }
.d-close:hover { background:rgba(28,26,18,0.07); color:#1C1610; }
.d-body { margin:14px auto 0; padding-bottom:28px; width:100%;
  flex:1; overflow-y:auto; font-size:13.5px; line-height:1.9; color:var(--t2); }
.d-body .ph {
  font-size:12px; color:var(--t3); padding:14px 18px;
  background:rgba(74,103,65,0.06); border-left:2px solid rgba(74,103,65,0.28);
  border-radius:0 6px 6px 0; line-height:1.8;
}
.d-body .ph b { color:var(--moss); font-weight:600; }

/* 抽屉正文排版（内容块阶段用，先备好样式） */
.d-lead { font-size:14.5px; color:var(--t1); line-height:1.85; margin-bottom:4px; }
.d-lead b { color:var(--cedar); font-weight:700; }
.d-sec-l {
  font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:0.18em;
  text-transform:uppercase; color:var(--t3); margin:20px 0 10px;
  display:flex; align-items:center; gap:10px;
}
.d-sec-l::after { content:''; flex:1; height:1px; background:rgba(28,26,18,0.08); }
.d-note {
  font-size:12.5px; color:var(--t2); padding:12px 16px; line-height:1.8;
  background:rgba(74,103,65,0.07); border-left:2px solid rgba(74,103,65,0.30);
  border-radius:0 6px 6px 0; margin:12px 0;
}
.d-note.amber { background:rgba(184,130,10,0.07); border-left-color:rgba(184,130,10,0.36); }
.d-note.rust  { background:rgba(176,106,74,0.08); border-left-color:rgba(176,106,74,0.38); }
.d-note b { color:var(--moss); font-weight:600; }
.d-note.amber b { color:var(--amber); }
.d-note.rust b  { color:var(--rust); }
.d-k {
  font-family:'JetBrains Mono',monospace; font-size:0.9em;
  background:rgba(28,26,18,0.06); padding:1px 6px; border-radius:4px; color:var(--cedar);
}
.d-rows { display:flex; flex-direction:column; margin:12px 0; }
.d-row { display:flex; gap:16px; padding:9px 2px; border-bottom:1px solid rgba(28,26,18,0.06); font-size:12.5px; }
.d-row .rk { flex:0 0 140px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--cedar); line-height:1.5; }
.d-row .rv { flex:1; color:var(--t2); line-height:1.6; }
.d-ul { margin:10px 0; padding:0; list-style:none; }
.d-ul li { position:relative; padding-left:19px; margin-bottom:9px; font-size:13px; color:var(--t2); line-height:1.7; }
.d-ul li::before { content:''; position:absolute; left:4px; top:9px; width:5px; height:5px; border-radius:50%; background:var(--moss); }
.d-ul li b { color:var(--t1); font-weight:600; }
.d-body h4 { font-size:11px; font-weight:700; color:var(--t1); text-transform:uppercase; letter-spacing:0.08em; margin:18px 0 7px; }
.d-body p { margin:8px 0; }
.d-body code { font-family:'JetBrains Mono',monospace; font-size:11px; background:rgba(28,26,18,0.07); padding:1px 5px; border-radius:3px; color:var(--cedar); }
.d-body .src { font-family:'JetBrains Mono',monospace; font-size:10.5px; line-height:1.65; background:rgba(28,26,18,0.06); border-left:2px solid rgba(74,103,65,0.40); padding:10px 12px; border-radius:0 6px 6px 0; margin:8px 0; white-space:pre-wrap; word-break:break-word; }
.d-body .tr { font-size:12px; padding:8px 12px; background:rgba(74,103,65,0.07); border-radius:6px; margin:4px 0 10px; line-height:1.7; }
.ref { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--moss); background:rgba(74,103,65,0.12); padding:1px 5px; border-radius:3px; white-space:nowrap; }
.d-body h4.code, .d-body h4.prompt { padding:5px 10px; border-radius:5px; text-transform:none; font-size:11.5px; letter-spacing:0.02em; }
.d-body h4.code   { background:rgba(74,103,65,0.12);  color:var(--moss);  border-left:3px solid var(--moss); }
.d-body h4.prompt { background:rgba(184,130,10,0.13); color:var(--amber); border-left:3px solid var(--amber); }
.d-body details.d-exp { margin:10px 0; border:1px solid rgba(184,130,10,0.28); border-radius:6px; overflow:hidden; }
.d-body details.d-exp summary { cursor:pointer; padding:7px 11px; background:rgba(184,130,10,0.07); font-size:11.5px; font-weight:600; color:var(--cedar); display:flex; align-items:center; gap:7px; list-style:none; user-select:none; }
.d-body details.d-exp summary::-webkit-details-marker { display:none; }
.d-body details.d-exp summary::before { content:'+'; font-size:11px; color:var(--amber); }
.d-body details[open].d-exp summary::before { content:'−'; }
.d-body details.d-exp .exp-in { padding:10px 12px; border-top:1px solid rgba(184,130,10,0.18); }

.d-body::-webkit-scrollbar { width:7px; }
.d-body::-webkit-scrollbar-track { background:transparent; }
.d-body::-webkit-scrollbar-thumb { background:rgba(28,26,18,0.16); border-radius:4px; }
.d-body::-webkit-scrollbar-thumb:hover { background:rgba(28,26,18,0.28); }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div class="grain"></div>

<div class="hud-divider"></div>
<div class="hud-left">
  <div class="hud-acc"></div>
  <div class="hud-title">RepoHunter</div>
  <div class="hud-sub">仓库发现与深度排序 · 全景流程图</div>
</div>
<div class="hud-right">
  <div class="hud-badge">Architecture Map</div>
  <div class="hud-name">New_Repo_Hunter</div>
</div>

<div id="viewport">
  <div id="canvas">
    <svg id="edges"></svg>
    <div id="labelLayer"></div>
    <div id="nodeLayer"></div>
  </div>
</div>

<div class="controls">
  <div class="ctrl-btn" id="expandAll" title="全部展开">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l5 5 5-5"/><path d="M7 13l5 5 5-5"/></svg>
  </div>
  <div class="ctrl-btn" id="collapseAll" title="全部收起">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11l5-5 5 5"/><path d="M7 17l5-5 5 5"/></svg>
  </div>
  <div class="ctrl-sep"></div>
  <div class="ctrl-btn" id="zin">+</div>
  <div class="ctrl-btn" id="zout">−</div>

/* ── 正交折线连线 ───────────────────────────────────── */
function anchor(n, side) {
  const hw = n._w/2, hh = n._h/2;
  switch (side) {
    case 't': return {x:n.x,    y:n.y-hh};
    case 'b': return {x:n.x,    y:n.y+hh};
    case 'l': return {x:n.x-hw, y:n.y};
    case 'r': return {x:n.x+hw, y:n.y};
  }
}
function routePoints(e, a, b) {
  if (e.ch != null) return [a, {x:e.ch, y:a.y}, {x:e.ch, y:b.y}, b];
  const fs = e.fs || 'b';
  if (fs === 'l' || fs === 'r') {
    if (Math.abs(a.y - b.y) < 1) return [a, b];
    const mx = (a.x + b.x)/2;
    return [a, {x:mx, y:a.y}, {x:mx, y:b.y}, b];
  }
  if (Math.abs(a.x - b.x) < 1) return [a, b];
  const my = a.y + (b.y - a.y)*0.5;
  return [a, {x:a.x, y:my}, {x:b.x, y:my}, b];
}
function roundedPath(pts, r) {
  if (pts.length < 2) return '';
  if (pts.length === 2) return `M${pts[0].x},${pts[0].y} L${pts[1].x},${pts[1].y}`;
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length-1; i++) {
    const p = pts[i], prev = pts[i-1], next = pts[i+1];
    const d1 = Math.min(r, Math.hypot(p.x-prev.x, p.y-prev.y)/2);
    const d2 = Math.min(r, Math.hypot(next.x-p.x, next.y-p.y)/2);
    const u1 = {x:(prev.x-p.x), y:(prev.y-p.y)}, l1 = Math.hypot(u1.x,u1.y)||1;
    const u2 = {x:(next.x-p.x), y:(next.y-p.y)}, l2 = Math.hypot(u2.x,u2.y)||1;
    const a = {x:p.x + u1.x/l1*d1, y:p.y + u1.y/l1*d1};
    const c = {x:p.x + u2.x/l2*d2, y:p.y + u2.y/l2*d2};
    d += ` L${a.x},${a.y} Q${p.x},${p.y} ${c.x},${c.y}`;
  }
  const last = pts[pts.length-1];
  d += ` L${last.x},${last.y}`;
  return d;
}

const DEFS = `<defs>
<marker id="arr"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="rgba(28,26,18,0.42)"/></marker>
<marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="rgba(184,130,10,0.62)"/></marker>
<marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L6,3 L0,6 Z" fill="rgba(58,106,102,0.62)"/></marker>

function buildEdges() {
  let paths = '';
  let labels = '';
  EDGES.forEach((e, idx) => {
    const a = anchor(byId[e.f], e.fs || 'b');
    const b = anchor(byId[e.t], e.ts || 't');
    const pts = routePoints(e, a, b);
    const d = roundedPath(pts, 13);
    const marker = e.type === 'dash' ? 'arrA' : e.type === 'feedback' ? 'arrT' : 'arr';
    const cls = e.type ? `e-${e.type}` : 'e-norm';
    paths += `<path class="edge-base ${cls}" data-i="${idx}" d="${d}" marker-end="url(#${marker})"/>`;
    if (!e.type) paths += `<path class="edge-flow" data-i="${idx}" d="${d}"/>`;
    if (e.lbl) {
      const lp = pts.length >= 4
        ? {x:(pts[1].x+pts[2].x)/2, y:(pts[1].y+pts[2].y)/2}
        : {x:(pts[0].x+pts[pts.length-1].x)/2, y:(pts[0].y+pts[pts.length-1].y)/2};
      labels += `<div class="elabel" data-i="${idx}" style="left:${lp.x}px;top:${lp.y}px">${e.lbl}</div>`;
    }
  });
  svg.innerHTML = DEFS + paths;
  labelLayer.innerHTML = labels;
}

const edgeEls = EDGES.map((e, idx) => ({

/* ── 拓扑：邻接表 + 可达性 + 独占下游计数 ── */
const childEdges = {};
EDGES.forEach((e, idx) => { (childEdges[e.f] = childEdges[e.f] || []).push({ idx, v: e.t }); });
const ROOT = NODES[0].id;

function reachable(blocked) {
  const vis = new Set([ROOT]); const q = [ROOT];
  while (q.length) {
    const u = q.shift();
    if (blocked.has(u)) continue;
    (childEdges[u] || []).forEach(({ v }) => { if (!vis.has(v)) { vis.add(v); q.push(v); } });
  }
  return vis;
}
const TOTAL = NODES.length;
const exCount = {};
NODES.forEach(n => { exCount[n.id] = TOTAL - reachable(new Set([n.id])).size; });

/* ── 藤蔓生长入场：按真实拓扑逐级蔓延 ── */
function animateGrowth() {
  const SPEED = 0.5, GAP = 55, MINDUR = 175;
  const L = edgeEls.map(x => x.base ? x.base.getTotalLength() : 0);
  const growDur = i => Math.max(MINDUR, L[i] * SPEED);

  const arrive = {}; arrive[ROOT] = 0;
  const eStart = new Array(EDGES.length).fill(null);
  for (let it = 0; it < NODES.length + 2; it++) {
    let changed = false;
    EDGES.forEach((e, i) => {
      if (e.type === 'feedback') return;
      const au = arrive[e.f]; if (au == null) return;
      if (eStart[i] == null || au < eStart[i]) { eStart[i] = au; changed = true; }
      const rv = au + growDur(i) + GAP;
      if (arrive[e.t] == null || rv < arrive[e.t]) { arrive[e.t] = rv; changed = true; }
    });
    if (!changed) break;
  }
  EDGES.forEach((e, i) => { if (eStart[i] == null) eStart[i] = (arrive[e.f] != null ? arrive[e.f] : 0); });

  let maxEnd = 0;
  EDGES.forEach((e, i) => {
    const p = edgeEls[i].base; if (!p) return;
    const len = L[i], dur = growDur(i), delay = eStart[i];
    const mk = p.getAttribute('marker-end');
    p.removeAttribute('marker-end');
    p.style.strokeDasharray = len + ' ' + len;
    p.style.strokeDashoffset = len;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      p.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(0.37,0,0.4,1) ${delay}ms`;
      p.style.strokeDashoffset = '0';
    }));
    const end = delay + dur;
    maxEnd = Math.max(maxEnd, end);
    setTimeout(() => {
      p.style.transition = ''; p.style.strokeDasharray = ''; p.style.strokeDashoffset = '';
      if (mk) p.setAttribute('marker-end', mk);
      if (edgeEls[i].label) edgeEls[i].label.classList.add('show');
    }, end + 30);
  });

  NODES.forEach(n => {
    const t = arrive[n.id] != null ? arrive[n.id] : 0;
    setTimeout(() => { if (n._el) n._el.classList.add('shown'); }, t);
  });

  setTimeout(() => {
    document.querySelectorAll('.edge-flow').forEach(f => f.classList.add('live'));
    document.querySelectorAll('.k-core, .k-out').forEach(c => c.classList.add('live'));
  }, maxEnd + 200);
}
requestAnimationFrame(() => {

/* ── 折叠 / 展开：右键节点折叠其独占下游 ── */
const collapsed = new Set();
function applyVisibility() {
  const vis = reachable(collapsed);
  NODES.forEach(n => n._wrap.classList.toggle('collapsed-hidden', !vis.has(n.id)));
  EDGES.forEach((e, idx) => {
    const show = vis.has(e.f) && !collapsed.has(e.f) && vis.has(e.t);
    const els = edgeEls[idx];
    els.base  && els.base.classList.toggle('ehidden', !show);
    els.flow  && els.flow.classList.toggle('ehidden', !show);
    els.label && els.label.classList.toggle('ehidden', !show);
  });
  NODES.forEach(n => {
    const on = collapsed.has(n.id) && vis.has(n.id) && exCount[n.id] > 0;
    if (on) { n._badge.textContent = '+' + exCount[n.id]; n._badge.classList.add('on'); }
    else n._badge.classList.remove('on');
  });
}
function toggleCollapse(id) {
  if (exCount[id] <= 0) return;
  if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
  applyVisibility();
}
function collapseAll() {
  collapsed.clear();
  NODES.forEach(n => { if (exCount[n.id] > 0) collapsed.add(n.id); });
  applyVisibility();
}
function expandAll() { collapsed.clear(); applyVisibility(); }

/* ── 平移缩放 ── */
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
let tx=0, ty=0, scale=1;

function contentBox() {
  const xs1 = NODES.map(n => n.x - n._w/2), xs2 = NODES.map(n => n.x + n._w/2);
  const ys1 = NODES.map(n => n.y - n._h/2), ys2 = NODES.map(n => n.y + n._h/2);
  const x = Math.min(...xs1) - 40, y = Math.min(...ys1) - 30;
  return {x, y, w:Math.max(...xs2)+40-x, h:Math.max(...ys2)+30-y};
}
function apply() { canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit() {
  const c = contentBox();
  const vw = innerWidth, vh = innerHeight;
  scale = Math.min(vw/c.w, vh/c.h) * 0.92;
  tx = (vw - c.w*scale)/2 - c.x*scale;
  ty = (vh - c.h*scale)/2 - c.y*scale + 12;
  apply();
}
fit();

function zoomAt(mx, my, factor) {
  const ns = Math.max(0.18, Math.min(2.4, scale*factor));
  const k = ns/scale;
  tx = mx - (mx - tx)*k;
  ty = my - (my - ty)*k;
  scale = ns; apply();
}
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.893);
}, {passive:false});

let down=false, moved=false, sx=0, sy=0, tx0=0, ty0=0, downTarget=null;
viewport.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  down=true; moved=false; sx=e.clientX; sy=e.clientY; tx0=tx; ty0=ty;
  downTarget = e.target;
  viewport.classList.add('grabbing');
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', e => {
  if (!down) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if (Math.hypot(dx,dy) > 4) moved=true;
  tx = tx0+dx; ty = ty0+dy; apply();
});
viewport.addEventListener('pointerup', e => {
  if (e.button !== 0) return;
  down=false; viewport.classList.remove('grabbing');
  if (!moved && downTarget) {
    const badge = downTarget.closest('.node-badge');
    if (badge && badge.classList.contains('on')) { toggleCollapse(badge.dataset.badge); downTarget = null; return; }
    const card = downTarget.closest('.card');
    if (card) openDrawer(card.dataset.id);
  }
  downTarget = null;
});
viewport.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card');
  if (card) { e.preventDefault(); toggleCollapse(card.dataset.id); }
});

document.getElementById('zin').onclick   = () => zoomAt(innerWidth/2, innerHeight/2, 1.2);

document.getElementById('zhome').onclick = fit;
document.getElementById('expandAll').onclick   = expandAll;
document.getElementById('collapseAll').onclick = collapseAll;

FAN: `<p class="d-lead">拆解出来后，每条 keypoint 判它到底命没命中。<b>翻源码的活不交给辩论方</b>（由代码按需去做），辩论方不带工具、只管判断。每条 keypoint 一条独立链路：分诊 → 按需取证 → 正反并行 → 锚点核验 → 立刻单条裁决。<span class="ref">explorer.py:783</span></p>
<h4 class="code">代码约束 · 缓存焐热的并发编排</h4>
<p>拆解拼进 system 尾部成 system_debate，分诊、正、反三方共享这个前缀 <span class="ref">explorer.py:777</span>。<b>先跑第一条 keypoint 焐热这段新前缀，再并发其余</b>：全并发的话所有 keypoint 抢着写同一段新前缀，缓存还没建好就都 miss，拆解白算 n 遍。<span class="ref">explorer.py:843</span></p>
<div class="d-note">gate 和 explorer 焐热的是前半段原 system；拆解那段每仓库首次 debate 调用 miss 一次、之后全命中。一次裁决只看一条 keypoint，上下文干净不串条；keypoint 由代码绑定回结果，对齐结构上有保证。</div>`,

TRI: `<p class="d-lead">一次<b>中立</b>的调用，不站正反任何一方。给它拆解和一条 keypoint，它只回答两件事：手上的拆解够不够判这条，不够要看哪几个文件或符号。<span class="ref">debate.py:159</span></p>
<h4 class="prompt">提示词约束 · 判够不够的尺子</h4>
<ul class="d-ul">
<li>key_designs 里有直接对应的设计、带 where 锚点、说清了做没做，<b>够</b></li>

<li>问的能力拆解没提、只含糊带过、没落到具体文件，<b>不够</b></li>

</ul>

<p>need 清单每项固定 path + symbol 两个字段、最多 6 项，path 优先照已核验过的 where 锚点填。解析不出或结构不对一律当「够判」退回，格式问题不卡链路；模型说的 sufficient 只作参考，<b>真正要不要取证由清单里兑现了的那几段决定</b>。<span class="ref">debate.py:198</span></p>`,

EVD: `<p class="d-lead">纯代码的活，<b>不花一次模型调用</b>。要看哪个文件哪个符号全是分诊清单定的，这步只照着清单去克隆里抠源码，自己不判断该看什么。<span class="ref">evidence.py:65</span></p>
<div class="d-sec-l">兜底关卡</div>
<div class="d-rows">
<div class="d-row"><div class="rk">路径核验</div><div class="rv">必须在仓库内、真实存在、指向文件；越界编造的直接丢 <span class="ref">evidence.py:92</span></div></div>

DEB: `<p class="d-lead">正反两方拿到<b>同一份材料</b>（拆解在 system、按需抠的源码在 user）并行各表一次态，输出都是一句话证据加 where 锚点。<span class="ref">explorer.py:810</span><span class="ref">debate.py:57</span></p>
<h4 class="prompt">提示词约束 · 正方 advocate</h4>
<p>为「满足该需求」找最强支持：锚点已核验过是最直接证据；定性类需求引 README、purpose 原话、where 留空；体量热度直接引数字；<b>找不到就如实写没找到，严禁硬凑</b>；复合需求（「适合简历的中小型项目」）任一意思缺证，整条按没找到。<span class="ref">skills/advocate.md</span></p>
<h4 class="prompt">提示词约束 · 反方 skeptic</h4>
<p>逐个类型排查反证：空壳实现、只有示例没有实现、依赖声明了但没用、数字冲突、拆解与源码对不上、定性定位不符。拆解可能有错漏，它的说法不能直接当真；找不到反证也如实写，<b>严禁为反而反</b>。<span class="ref">skills/skeptic.md</span></p>
<h4 class="code">代码约束 · 锚点核验与格式兜底</h4>
<p>双方的 where 由代码逐条核验，核不上置空标 unverified，裁决时只当说法不当事实 <span class="ref">audit.py:94</span>。强制 JSON 坏了修格式重试一次 <span class="ref">debate.py:108</span>；日志攒进 sink 统一分块输出，防正反并行时交叉 <span class="ref">debate.py:114</span>。</p>`,

ADJ: `<p class="d-lead">一个上下文干净的裁决者收口，一次只裁一条 keypoint，权衡双方过完锚点审计的论据判 hit / miss。<span class="ref">skills/adjudicate.md</span></p>
<h4 class="prompt">提示词约束 · 判断闸口就一条</h4>
<p>需求问「这项目是什么」（定性类）就认 README、topics、purpose 里一致的定位，<b>不卡 where</b>；问「里面有没有某实现」（实现类）就必须有带核验过 where 的源码事实，README 一句话是说法不是事实。两头都不过界。</p>

<div class="d-rows">
<div class="d-row"><div class="rk">结论一致</div><div class="rv">按正面事实判，有就 hit 没有就 miss，不管正方说得多好听</div></div>
<div class="d-row"><div class="rk">各执一词</div><div class="rv">看谁的事实更直接命中需求本义，结合 keypoint 的确切要求裁</div></div>
<div class="d-row"><div class="rk">部分满足</div><div class="rv">满足的那部分够不够称得上成立，只沾边就 miss</div></div>
</div>
<div class="d-note">裁决的 {keypoint} 填纯原文<b>不拼判定标准</b>：裁决只权衡双方已在标准下取的证据 <span class="ref">debate.py:96</span>。evidence 必须点明采信哪方、另一方为什么不推翻。</div>`,

SCR: `<p class="d-lead">模型给的判定<b>不直接信</b>，按位置对齐回发出的清单：第 i 条判定对应第 i 条需求，keypoint 字段一律用我们发出的原文，模型写的不看。<span class="ref">scoring.py:12</span></p>

</ul>`,

RUNS: `<p class="d-lead">搜索账本：一次搜索占一行，存关键词、语言、每仓库轻量增量（判定、trace、token）和花费。<span class="d-k">save_run</span> 是<b>唯一写入口</b>：先插 run 行拿 run_id，再回调仓库账本 upsert，保证时间线指得回真实的一次搜索。<span class="ref">runs.py:61</span></p>

RM: `<p class="d-lead">仓库账本：一仓库一行、主键 full_name，存跨搜索不变的贵拆解。拆解按语言分<b>中英两格</b>各存一份，互不覆盖；老数据没语言标记一律当中文。<span class="ref">repo_memory.py:40</span><span class="ref">repo_memory.py:19</span></p>

CHAT: `<p class="d-lead">对话主循环 <span class="d-k">stream_chat</span>，一轮走五步：答前试压缩 → 拼 system（内含召回）→ 吐 prompt 事件给监控 → 流式调 DeepSeek 逐字上屏 → 聊完起两个后台任务。吐的是中性事件（prompt / delta / done / error），跟传输格式无关，webapp 再包成 SSE。<span class="ref">session.py:40</span></p>
<div class="d-sec-l">几个关键动作</div>
<div class="d-rows">
<div class="d-row"><div class="rk">recall 转正</div><div class="rv">召回命中的仓库多吐一个事件，前端右栏补常驻「召回」芯片，追问不再依赖挑选器 <span class="ref">session.py:72</span></div></div>
<div class="d-row"><div class="rk">reactive 硬截</div><div class="rv">估算压过了服务端仍报「太长」，命中关键词就再砍一刀历史重试一次 <span class="ref">session.py:22</span><span class="ref">session.py:82</span></div></div>
<div class="d-row"><div class="rk">压缩后收尾</div><div class="rv">吐 compacted 事件替换前端旧历史，提取和笔记两个游标按新长度重置 <span class="ref">session.py:108</span></div></div>
<div class="d-row"><div class="rk">payload 清洗</div><div class="rv">下划线开头的监控字段（_compact_summary）剥掉不进请求体 <span class="ref">session.py:31</span></div></div>
</div>
<h4 class="prompt">提示词约束 · 人设与边界纪律</h4>
<p>对话和搜索完全解耦，<b>助手不能发起搜索</b>：没分析过的仓库直接回「去搜索页跑一次」，不编内容不假装分析过。索引只是一句摘要、正文没补进来别硬编细节；带「N 天前」的是当时的观察别当实时状态；候选清单分不清就反问。<span class="ref">skills/llm_skill.md</span></p>`,

CPT: `<p class="d-lead">答前的压缩判断 <span class="d-k">maybe_compact</span>：对话历史（不含 system）估到 <b>40K token</b> 才动手，没到线原样放行。压缩就是把旧消息换成一条包着笔记或摘要的说明消息，最近消息原样保留。<span class="ref">compact.py:127</span><span class="ref">compact.py:21</span></p>
<div class="d-sec-l">三级路径</div>
<div class="d-rows">
<div class="d-row"><div class="rk">1 · 笔记顶替</div><div class="rv">零模型成本，过四道检查：笔记非空、游标在范围、保留段非空、压完低于触发线 <span class="ref">compact.py:89</span></div></div>
<div class="d-row"><div class="rk">2 · 现写摘要</div><div class="rv">笔记不可用才现调一次模型总结整段历史 <span class="ref">compact.py:153</span></div></div>
<div class="d-row"><div class="rk">3 · 硬截保命</div><div class="rv">摘要也失败就砍最老几轮；连续失败 2 次熔断，之后不再烧钱试、直接硬截 <span class="ref">compact.py:29</span><span class="ref">compact.py:140</span></div></div>
</div>
<h4 class="code">代码约束 · 保留段的三个数字</h4>
<p>保留段下限 4000 token 且至少 4 条（差哪个就往前多留一条）、上限 16000 封顶，最后对齐到 user 消息开头，防切在 assistant 中间像自说自话。<span class="ref">compact.py:61</span><span class="ref">compact.py:50</span></p>

CTX: `<p class="d-lead">拼给模型的 system 不揉成一坨，拆成带标签的段：人设永远头一段，然后是长期记忆索引、每个注入仓库、召回补入的段。分段结构随 prompt 事件给前端，点头像按板块分色看这轮喂了什么。<span class="ref">context.py:277</span></p>
<div class="d-rows">
<div class="d-row"><div class="rk">记忆索引</div><div class="rv">三类通用记忆每条压成「[类型] 名字（N 天前）：一句摘要」，正文不进上下文、等召回才补 <span class="ref">context.py:85</span></div></div>

<div class="d-row"><div class="rk">召回段</div><div class="rv">命中仓库标 recalled 加「N 天前分析的快照」提醒；记忆正文、会话笔记、歧义候选各成一段 <span class="ref">context.py:195</span></div></div>
</div>
<h4 class="code">代码约束 · 时间一律「N 天前」</h4>
<p>模型不擅长日期算术，看见「2026-05-12」不会起疑，看见「56 天前」才会想到可能过时，所有时间戳换算成相对天数再进上下文。<span class="ref">context.py:69</span></p>
<div class="d-note">末尾挂一个 recall_debug 段带完整召回判断（清单、模型原始返回、三档挑了谁），它的 kind 不在拼接白名单里、<b>不发给模型</b>，只随 prompt 事件给前端和 dev 监控 <span class="ref">context.py:184</span>。</div>`,

RCL: `<p class="d-lead">每轮拼 system 前先用小模型跑一次挑选。<span class="d-k">select_from_manifest</span> 是通用原语：只认 {name, description} 清单，不认条目是仓库、记忆还是会话笔记，拿回名字后由调用方分派。<span class="ref">recall.py:78</span></p>

const drawer = document.getElementById('drawer');
function clearSelected() {
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
}
function openDrawer(id) {
  const n = byId[id]; if (!n) return;
  const col = SRC[n.src];
  const b = document.getElementById('d-badge');
  b.textContent = SRCNAME[n.src];
  b.style.background = hexA(col, 0.16); b.style.color = col;
  document.getElementById('d-title').textContent = n.title;
  document.getElementById('d-sub').textContent = n.sub;
  document.getElementById('d-body').innerHTML = BODIES[id]
    || `<div class="ph"><b>${n.title}</b> · ${n.sub}<br>地基占位节点，详情正文在后续内容块里填入。</div>`;
  document.getElementById('d-body').scrollTop = 0;
  clearSelected();
  if (n._el) n._el.classList.add('selected');
  drawer.classList.add('open');
}
function closeDrawer() { drawer.classList.remove('open'); clearSelected(); }

document.getElementById('d-close').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* 抽屉拖拽调宽：按住左边缘把手左右拖，宽度受 CSS 的 min/max 夹住 */
(function () {
  const grip = document.getElementById('drawer-resize');
  let dragging = false;
  grip.addEventListener('pointerdown', e => {
    dragging = true;
    grip.classList.add('dragging');
    drawer.classList.add('resizing');   // 拖动时关掉过渡，跟手不飘
    grip.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return;
    // 抽屉贴右边，宽度就是「视口右缘减鼠标 x」，CSS 的 min/max 会自动夹住
    drawer.style.width = (innerWidth - e.clientX) + 'px';
  });
  grip.addEventListener('pointerup', e => {
    dragging = false;
    grip.classList.remove('dragging');
    drawer.classList.remove('resizing');
    grip.releasePointerCapture(e.pointerId);
  });
})();
</script>
